Listen 443

#trimming lab-ssl.conf so it does not repeat LoadModule as they are already in httpd.conf
#LoadModule ssl_module modules/mod_ssl.so
#LoadModule proxy_module modules/mod_proxy.so
#LoadModule proxy_http_module modules/mod_proxy_http.so
#LoadModule headers_module modules/mod_headers.so
#LoadModule socache_shmcb_module modules/mod_socache_shmcb.so

SSLRandomSeed startup builtin
SSLRandomSeed connect builtin

<VirtualHost *:443>
    ServerName localhost

    SSLEngine on
    SSLCertificateFile /usr/local/apache2/certs/lab.pem
    SSLCertificateKeyFile /usr/local/apache2/certs/lab-key.pem

    # Backend listens on 80 inside the compose network
    ProxyPreserveHost On
    ProxyPass        / http://backend:80/
    ProxyPassReverse / http://backend:80/

    ErrorLog  /usr/local/apache2/logs/lab-error.log
    CustomLog /usr/local/apache2/logs/lab-access.log combined
</VirtualHost>
